<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingliism — библиотека знаний</title><meta name="description" content="Демонстрационный информационный сайт Ingliism на русском и английском языках."><style>
:root{--paper:#f4f0e7;--ink:#263d37;--muted:#68716a;--line:#d4d8ca;--gold:#a68048}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,sans-serif}button,a,input{font:inherit}a{color:inherit;text-decoration:none}button{cursor:pointer}header{max-width:1320px;margin:auto;padding:25px 5%;display:flex;align-items:center;gap:40px;border-bottom:1px solid var(--line)}.brand{font:30px Georgia,serif;letter-spacing:2px}.brand span{color:var(--gold)}nav{display:flex;gap:28px;margin-left:auto}nav a{font-size:13px}nav a:hover,nav a[aria-current]{color:var(--gold)}.languages{display:flex;border-left:1px solid var(--line);padding-left:22px;gap:8px}.languages button{border:0;background:none;color:var(--muted);padding:3px}.languages button.active{color:var(--ink);text-decoration:underline;text-underline-offset:6px}main{max-width:1180px;margin:auto;padding:0 28px}.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:60px;align-items:center;padding:78px 0 65px}.eyebrow{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);font-weight:600}h1{font:clamp(44px,5.5vw,73px)/1.08 Georgia,serif;letter-spacing:-2px;margin:22px 0}h1 em{font-weight:normal;color:#6e816b}p.intro{color:var(--muted);max-width:450px;font-size:16px}.primary{display:inline-block;background:var(--ink);color:#fff;padding:13px 23px;margin-top:20px;font-size:13px}.primary:hover{background:#415d50}.art{height:390px;position:relative;overflow:hidden;border-radius:48% 48% 3px 3px;background:#e7e8d9;border:1px solid #d6dacb}.art:before{content:'';position:absolute;inset:23px;border:1px solid #bfc9b7;border-radius:48% 48% 0 0}.sun{position:absolute;width:105px;height:105px;border-radius:50%;background:#d2b784;top:80px;left:calc(50% - 52px)}.hill{position:absolute;width:700px;height:320px;border-radius:50%;bottom:-220px;left:-220px;background:#687d64;transform:rotate(20deg)}.hill.second{bottom:-180px;left:60px;background:#9aaa87;transform:rotate(-20deg)}.hill.third{bottom:-235px;left:-80px;background:#344f43;transform:rotate(-8deg)}.art-label{position:absolute;bottom:28px;left:0;right:0;text-align:center;font:italic 18px Georgia;color:#f2efe4;z-index:2}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;padding:32px 0 23px;border-top:1px solid var(--line)}h2{font:36px/1.2 Georgia,serif;margin:8px 0}.small{font-size:13px;color:var(--muted)}.search{border:0;border-bottom:1px solid #a9b5a3;background:transparent;padding:9px 0;width:220px;color:var(--ink);border-radius:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}.card{display:block;padding:27px 0 25px;border-top:2px solid #9cae93}.card .num{font:italic 30px Georgia;color:#9aab91}.card h3{font:26px/1.2 Georgia;margin:20px 0 12px}.card p{font-size:14px;color:var(--muted);min-height:70px}.card .read{font-size:12px;color:var(--ink)}.card:hover h3{text-decoration:underline;text-underline-offset:5px}.about{margin:40px 0 60px;padding:35px 40px;background:#e7e9dd;display:grid;grid-template-columns:1fr 2fr;gap:40px}.about p{margin:0;color:var(--muted);font-size:14px}.about h2{margin:0;font-size:28px}.demo{font-size:11px;letter-spacing:.5px;border:1px solid #b4bea9;padding:4px 9px;display:inline-block;margin-top:15px}footer{border-top:1px solid var(--line);max-width:1180px;margin:auto;padding:24px 28px 35px;display:flex;justify-content:space-between;color:var(--muted);font-size:11px;gap:20px}.article{max-width:730px;margin:55px auto 85px}.article h1{font-size:52px}.article h2{font-size:29px;margin-top:32px}.article p{color:#526058}.back{border:0;background:transparent;color:var(--gold);padding:0}.empty{padding:30px 0;color:var(--muted)}:focus-visible{outline:2px solid var(--gold);outline-offset:5px}[hidden]{display:none!important}@media(max-width:800px){header{gap:15px;flex-wrap:wrap}.brand{font-size:25px}nav{order:3;width:100%;justify-content:space-between;gap:10px}nav a{font-size:12px}.languages{margin-left:auto}.hero{grid-template-columns:1fr;gap:30px;padding-top:42px}.art{height:280px;max-width:500px;width:100%;margin:auto}.grid{grid-template-columns:1fr}.card p{min-height:0}.section-head{align-items:start;flex-direction:column}.search{width:100%}.about{grid-template-columns:1fr;padding:25px;gap:15px}.article h1{font-size:40px}footer{flex-direction:column;gap:6px}}
</style></head><body><header><a class="brand" href="#home" aria-label="Ingliism">INGLI<span>I</span>SM</a><nav id="nav"></nav><div class="languages"><button id="ru" type="button">RU</button><button id="en" type="button">EN</button></div></header><main id="main"></main><footer><span>© Ingliism · <span id="foot"></span></span><span id="foot2"></span></footer>
<script>
const copy={ru:{nav:['Главная','Учение','Статьи','История','О проекте'],eye:'Открытая библиотека',heading:'Пространство<br>для <em>понимания.</em>',intro:'Знакомьтесь с идеями, изучайте источники и находите ответы на свои вопросы. В своём темпе, с вниманием к деталям.',explore:'Открыть библиотеку ↗',art:'Знание начинается с вопроса',library:'Исследуйте библиотеку',sub:'Начните с темы, которая вам близка.',search:'Поиск по статьям…',read:'Читать статью ↗',about:'О проекте',aboutText:'Это пример информационного сайта Ingliism. Здесь можно постепенно собирать статьи, первоисточники и иллюстрации на нескольких языках. Тексты на этой странице показывают структуру сайта и не являются изложением вероучения.',demo:'ДЕМОНСТРАЦИОННЫЙ КОНТЕНТ',footer:'Библиотека знаний',footer2:'Русский / English · Без регистрации',back:'← К библиотеке',empty:'Статьи не найдены.',section:'Раздел библиотеки',history:'Исторические материалы',historyText:'Этот раздел предназначен для хронологии, документов и описания исторического контекста. Добавляйте даты, ссылки на первоисточники и пояснения к каждому материалу. Пока это демонстрационная страница.',articles:[{id:'beginning',category:'Учение',title:'С чего начать изучение',desc:'Путеводитель по библиотеке: основные темы, понятия и порядок чтения.',body:['Как устроена библиотека','Начните с обзорного материала. Он помогает увидеть общую структуру темы, а затем перейти к отдельным понятиям и вопросам.','Читайте внимательно','В каждой статье можно размещать определения, примеры и ссылки на источники. Разделяйте цитаты из документов и авторские пояснения.','Продолжите исследование','Сохраняйте вопросы, возникающие во время чтения. Связанные материалы помогут рассмотреть их с разных сторон.']},{id:'sources',category:'Статьи',title:'Как работать с источниками',desc:'На что обращать внимание при чтении документов и сопоставлении текстов.',body:['Контекст имеет значение','Укажите автора, название, дату и место публикации документа. Эти сведения помогают читателю понять происхождение текста.','Цитаты и пояснения','Оформляйте прямые цитаты отдельно и указывайте источник. Если текст переведён, полезно добавить сведения о переводчике и оригинале.','Сопоставление материалов','Несколько источников могут по-разному описывать одно событие. Отмечайте различия и объясняйте, на какие документы опирается статья.']},{id:'history',category:'История',title:'История и контекст',desc:'Место для хронологии, исторических документов и комментариев.',body:['Постройте хронологию','Здесь можно разместить проверенные даты и краткие описания событий, дополнив их ссылками на документы.','Добавьте контекст','Поясните, какие обстоятельства важны для понимания каждого события. Иллюстрации и карты могут дополнять текст.','Укажите источники','В конце материала разместите библиографию и ссылки для дальнейшего чтения. Это демонстрационный текст, а не историческая справка.']}]},en:{nav:['Home','Teachings','Articles','History','About'],eye:'An open library',heading:'A space for<br><em>understanding.</em>',intro:'Explore ideas, read sources, and find answers to your questions. At your own pace, with attention to detail.',explore:'Explore the library ↗',art:'Knowledge begins with a question',library:'Explore the library',sub:'Begin with a topic that speaks to you.',search:'Search articles…',read:'Read article ↗',about:'About the project',aboutText:'This is a sample information website for Ingliism. It can hold a growing collection of articles, source documents, and illustrations in multiple languages. These sample texts demonstrate the website structure and do not describe religious doctrine.',demo:'DEMONSTRATION CONTENT',footer:'A library of knowledge',footer2:'Русский / English · No registration',back:'← Back to library',empty:'No articles found.',section:'Library section',history:'Historical materials',historyText:'This section is intended for a timeline, documents, and historical context. Add dates, primary sources, and notes for each item. This is currently a demonstration page.',articles:[{id:'beginning',category:'Teachings',title:'Where to begin',desc:'A guide to the library: key topics, concepts, and a suggested reading order.',body:['Finding your way','Start with an overview. It can help you understand the structure of a subject before exploring individual concepts and questions.','Read with care','Each article can include definitions, examples, and links to sources. Keep quotations from documents distinct from editorial explanations.','Continue exploring','Keep a list of questions as you read. Related materials can help you consider them from different perspectives.']},{id:'sources',category:'Articles',title:'Reading the sources',desc:'What to look for when reading documents and comparing different texts.',body:['Context matters','Record the author, title, date, and place of publication. These details help readers understand where a text comes from.','Quotations and notes','Clearly mark direct quotations and identify the source. For translations, include details about the translator and original text when available.','Comparing materials','Sources may describe the same event differently. Note the differences and explain which documents support an article.']},{id:'history',category:'History',title:'History and context',desc:'A place for timelines, historical documents, and explanatory notes.',body:['Build a timeline','Add verified dates and short descriptions of events, with links to documents.','Provide context','Explain which circumstances matter for each event. Illustrations and maps can complement the text.','List your sources','Finish with a bibliography and further reading. This is sample content, not a historical account.']}]}};
let lang=localStorage.getItem('ingliism-language')==='en'?'en':'ru';const routes=['home','teachings','articles','timeline','about'];
function card(a,i,c){return `<a class="card" href="#article/${a.id}"><span class="num">0${i+1}</span><div class="eyebrow" style="margin-top:14px">${a.category}</div><h3>${a.title}</h3><p>${a.desc}</p><span class="read">${c.read}</span></a>`}
function render(){let c=copy[lang],route=location.hash.slice(1)||'home';document.documentElement.lang=lang;document.title='Ingliism · '+c.footer;document.querySelector('#nav').innerHTML=routes.map((r,i)=>`<a href="#${r}" ${r===route?'aria-current="page"':''}>${c.nav[i]}</a>`).join('');for(let l of ['ru','en']){document.getElementById(l).classList.toggle('active',l===lang);document.getElementById(l).setAttribute('aria-pressed',l===lang)}document.getElementById('foot').textContent=c.footer;document.getElementById('foot2').textContent=c.footer2;
let about=`<section class="about"><div><h2>${c.about}</h2><span class="demo">${c.demo}</span></div><p>${c.aboutText}</p></section>`,content='';if(route.startsWith('article/')){let a=c.articles.find(a=>a.id===route.split('/')[1]);if(a)content=`<article class="article"><a class="back" href="#articles">${c.back}</a><p class="eyebrow">${a.category} · ${c.demo}</p><h1>${a.title}</h1><p class="intro">${a.desc}</p>${a.body.map((s,i)=>i%2===0?`<h2>${s}</h2>`:`<p>${s}</p>`).join('')}</article>`;}else if(route==='about')content=`<div style="padding-top:40px">${about}</div>`;else if(route==='timeline')content=`<article class="article"><p class="eyebrow">${c.section}</p><h1>${c.history}</h1><p>${c.historyText}</p><a class="primary" href="#article/history">${c.read}</a></article>`;else{if(route==='home')content=`<section class="hero"><div><div class="eyebrow">${c.eye}</div><h1>${c.heading}</h1><p class="intro">${c.intro}</p><a class="primary" href="#articles">${c.explore}</a></div><div class="art" role="img" aria-label="${lang==='ru'?'Стилизованный пейзаж с солнцем и холмами':'Stylized landscape with sun and hills'}"><div class="sun"></div><div class="hill second"></div><div class="hill"></div><div class="hill third"></div><div class="art-label">${c.art}</div></div></section>`;content+=`<section style="${route!=='home'?'margin-top:55px':''}"><div class="section-head"><div><div class="eyebrow">${c.section}</div><h2>${route==='teachings'?c.nav[1]:c.library}</h2><div class="small">${c.sub}</div></div><input class="search" type="search" aria-label="${c.search}" placeholder="${c.search}"></div><div class="grid" id="cards">${c.articles.filter((a,i)=>route!=='teachings'||i===0).map((a,i)=>card(a,i,c)).join('')}</div><p class="empty" hidden>${c.empty}</p></section>${about}`}document.querySelector('#main').innerHTML=content||`<p>${c.empty}</p>`;let search=document.querySelector('.search');if(search)search.addEventListener('input',()=>{let count=0;document.querySelectorAll('.card').forEach(el=>{el.hidden=!el.textContent.toLowerCase().includes(search.value.toLowerCase());if(!el.hidden)count++});document.querySelector('.empty').hidden=count>0})}
for(let l of ['ru','en'])document.getElementById(l).onclick=()=>{lang=l;localStorage.setItem('ingliism-language',l);render()};addEventListener('hashchange',()=>{render();scrollTo(0,0)});render();
</script></body></html>
